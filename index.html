<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #eef5f3;
      --panel: rgba(255, 255, 255, 0.82);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --line: rgba(21, 79, 70, 0.12);
      --text: #183b35;
      --muted: #58756f;
      --accent: #1ca38c;
      --accent-2: #88d3c4;
      --shadow: 0 30px 80px rgba(14, 46, 40, 0.18);
      --slide-scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(136, 211, 196, 0.62), transparent 28%),
        radial-gradient(circle at top right, rgba(28, 163, 140, 0.22), transparent 22%),
        linear-gradient(135deg, #f5fbf9 0%, #e6f2ef 44%, #d9ebe7 100%);
    }

    .shell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100vw;
      height: 100vh;
      padding: 28px;
    }

    .nav {
      width: 56px;
      height: 56px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      backdrop-filter: blur(16px);
      color: var(--text);
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 16px 36px rgba(20, 72, 63, 0.12);
      transition: transform 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .nav:hover {
      transform: translateY(-2px);
      background: rgba(255, 255, 255, 0.92);
    }

    .nav:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      transform: none;
    }

    .deck {
      width: min(1240px, calc(100vw - 180px));
      height: min(760px, calc(100vh - 56px));
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .slide-frame {
      position: relative;
      flex: 1;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(248, 252, 251, 0.88));
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .slide-frame::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(145deg, rgba(28, 163, 140, 0.09), transparent 24%),
        linear-gradient(320deg, rgba(136, 211, 196, 0.18), transparent 34%);
    }

    .slide-viewport {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .slide {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: clamp(22px, 3vw, 36px) clamp(20px, 3.2vw, 40px) clamp(18px, 2.4vw, 28px);
      display: flex;
      flex-direction: column;
      gap: clamp(16px, 2vw, 24px);
      transform-origin: top left;
      transform: scale(var(--slide-scale));
      will-change: transform;
    }

    .slide-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .page-tag {
      display: inline-flex;
      align-items: center;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(28, 163, 140, 0.1);
      color: var(--accent);
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .headline {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-width: 78%;
    }

    .headline h1,
    .headline h2 {
      margin: 0;
      font-size: clamp(30px, 3vw, 42px);
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    .headline p {
      margin: 0;
      color: var(--muted);
      font-size: clamp(13px, 1.3vw, 15px);
      line-height: 1.6;
    }

    .meta {
      min-width: 180px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid var(--line);
    }

    .meta-label {
      font-size: clamp(11px, 1vw, 12px);
      color: var(--muted);
    }

    .meta-value {
      font-size: clamp(14px, 1.3vw, 16px);
      font-weight: 700;
    }

    .hero-grid,
    .content-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(12, 1fr);
      min-height: 0;
      flex: 1;
    }

    .hero-panel,
    .content-card,
    .summary-bar {
      border: 1px solid var(--line);
      border-radius: 28px;
      background: var(--panel);
      box-shadow: 0 18px 34px rgba(23, 67, 59, 0.06);
    }

    .hero-panel {
      padding: clamp(18px, 2vw, 24px);
    }

    .hero-panel.primary {
      grid-column: span 8;
      background: linear-gradient(140deg, rgba(28, 163, 140, 0.12), rgba(255, 255, 255, 0.88));
    }

    .hero-panel.secondary {
      grid-column: span 4;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .hero-number {
      font-size: clamp(52px, 7vw, 88px);
      line-height: 0.9;
      font-weight: 800;
      color: rgba(24, 59, 53, 0.12);
    }

    .hero-kicker {
      font-size: clamp(12px, 1.1vw, 14px);
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.08em;
    }

    .hero-panel h3 {
      margin: 10px 0 14px;
      font-size: clamp(22px, 2.2vw, 28px);
      line-height: 1.2;
    }

    .hero-panel ul,
    .content-card ul {
      margin: 0;
      padding-left: 18px;
      display: grid;
      gap: clamp(8px, 1vw, 10px);
      color: var(--text);
      font-size: clamp(13px, 1.18vw, 15px);
      line-height: 1.55;
    }

    .hero-note {
      padding: 16px 18px;
      border-radius: 22px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px dashed rgba(28, 163, 140, 0.26);
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .content-card {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding: clamp(16px, 1.8vw, 20px) clamp(16px, 2vw, 22px);
      min-height: 0;
    }

    .content-card h3 {
      margin: 0;
      font-size: clamp(17px, 1.6vw, 20px);
      line-height: 1.25;
    }

    .content-card .card-tag {
      display: inline-flex;
      align-self: flex-start;
      padding: 6px 12px;
      border-radius: 999px;
      background: rgba(24, 59, 53, 0.06);
      color: var(--muted);
      font-size: clamp(11px, 1vw, 12px);
      font-weight: 700;
    }

    .content-card .mini {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-bar {
      padding: clamp(14px, 1.8vw, 18px) clamp(16px, 2vw, 22px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      background: linear-gradient(135deg, rgba(28, 163, 140, 0.12), rgba(255, 255, 255, 0.92));
    }

    .summary-bar strong {
      display: block;
      margin-bottom: 4px;
      font-size: clamp(13px, 1.2vw, 15px);
      color: var(--accent);
    }

    .summary-bar span {
      color: var(--text);
      font-size: clamp(14px, 1.3vw, 16px);
      line-height: 1.5;
    }

    .summary-chip {
      flex-shrink: 0;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(28, 163, 140, 0.18);
      font-size: clamp(11px, 1.1vw, 13px);
      font-weight: 700;
      color: var(--accent);
    }

    .slide-frame.scaled::after {
      content: "已按窗口大小自适应缩放";
      position: absolute;
      right: 16px;
      bottom: 14px;
      z-index: 2;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(28, 163, 140, 0.16);
      color: var(--muted);
      font-size: 11px;
      pointer-events: none;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      padding: 0 10px;
    }

    .counter {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    .dots {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex: 1;
      flex-wrap: wrap;
    }

    .dot {
      width: 10px;
      height: 10px;
      border: 0;
      padding: 0;
      border-radius: 999px;
      background: rgba(24, 59, 53, 0.18);
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, width 0.2s ease;
    }

    .dot.active {
      width: 28px;
      background: var(--accent);
    }

    .helper {
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 1100px) {
      .shell {
        padding: 16px;
        gap: 12px;
      }

      .deck {
        width: calc(100vw - 80px);
        height: calc(100vh - 32px);
      }

      .slide {
        padding: 28px 24px 22px;
      }

      .headline {
        max-width: 100%;
      }

      .slide-header {
        flex-direction: column;
      }

      .meta {
        width: 100%;
      }

      .hero-panel.primary,
      .hero-panel.secondary,
      .content-card {
        grid-column: span 12 !important;
      }

      .summary-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 720px) {
      body {
        overflow: auto;
      }

      .shell {
        min-height: 100vh;
      }

      .nav {
        position: fixed;
        bottom: 18px;
        z-index: 10;
      }

      .nav.prev {
        left: 18px;
      }

      .nav.next {
        right: 18px;
      }

      .deck {
        width: 100%;
        height: auto;
        min-height: calc(100vh - 32px);
      }

      .slide-frame {
        min-height: 80vh;
        overflow: visible;
      }

      .slide-frame.scaled::after {
        display: none;
      }

      .slide-viewport {
        height: auto;
        overflow: visible;
      }

      .slide {
        height: auto !important;
        min-height: 80vh !important;
        width: 100% !important;
        transform: none !important;
        will-change: auto;
      }

      .footer {
        padding-bottom: 72px;
        align-items: flex-start;
        flex-direction: column;
      }

      .summary-bar {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

    const slideFrameEl = document.getElementById("slideFrame");
    const slideViewportEl = document.getElementById("slideViewport");
    const slideEl = document.getElementById("slide");
    const counterEl = document.getElementById("counter");
    const dotsEl = document.getElementById("dots");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    let currentIndex = 0;
    let fitTimer = 0;

    function renderBullets(items) {
      return `<ul>${items.map((item) => `<li>${item}</li>`).join("")}</ul>`;
    }

    function renderCover(slide) {
      return `
        <div class="slide-header">
          <div class="headline">
            <span class="page-tag">${slide.page}</span>
            <h1>${slide.title}</h1>
            <p>${slide.subtitle}</p>
          </div>
          ${slide.hideMeta ? "" : `
          <div class="meta">
            ${(slide.meta || []).map((item, index) => `
              <div>
                <div class="meta-label">${index === 0 ? "信息" : "时间"}</div>
                <div class="meta-value">${item}</div>
              </div>
            `).join("")}
          </div>
          `}
        </div>
        <div class="hero-grid">
          <section class="hero-panel primary">
            <div class="hero-kicker">项目主线</div>
            <h3>${slide.heroTitle}</h3>
            ${renderBullets(slide.heroBullets)}
          </section>
          <aside class="hero-panel secondary">
            <div>
              <div class="hero-kicker">${slide.sideTitle}</div>
              ${renderBullets(slide.sideBullets)}
            </div>
            <div class="hero-number">${String(currentIndex + 1).padStart(2, "0")}</div>
          </aside>
        </div>
        <div class="summary-bar">
          <div>
            <strong>本页结论</strong>
            <span>${slide.summary}</span>
          </div>
          <div class="summary-chip">${slide.summaryChip}</div>
        </div>
      `;
    }

    function renderCards(slide) {
      const cards = slide.cards.map((card) => `
        <section class="content-card" style="grid-column: span ${card.span || 4}">
          ${card.tag ? `<span class="card-tag">${card.tag}</span>` : ""}
          <h3>${card.title}</h3>
          ${renderBullets(card.items)}
          ${card.note ? `<div class="mini">${card.note}</div>` : ""}
        </section>
      `).join("");

      return `
        <div class="slide-header">
          <div class="headline">
            <span class="page-tag">${slide.page}</span>
            <h2>${slide.title}</h2>
            <p>${slide.subtitle}</p>
          </div>
        </div>
        <div class="content-grid">${cards}</div>
        <div class="summary-bar">
          <div>
            <strong>本页总结</strong>
            <span>${slide.summary}</span>
          </div>
          <div class="summary-chip">${slide.summaryChip}</div>
        </div>
      `;
    }

    function renderSlide(index) {
      const slide = slides[index];
      slideEl.innerHTML = slide.cover ? renderCover(slide) : renderCards(slide);
      counterEl.textContent = `第 ${index + 1} 页 / 共 ${slides.length} 页`;
      prevBtn.disabled = index === 0;
      nextBtn.disabled = index === slides.length - 1;

      dotsEl.innerHTML = slides.map((item, dotIndex) => `
        <button
          class="dot ${dotIndex === index ? "active" : ""}"
          aria-label="跳转到第 ${dotIndex + 1} 页"
          data-index="${dotIndex}"
        ></button>
      `).join("");

      dotsEl.querySelectorAll(".dot").forEach((dot) => {
        dot.addEventListener("click", () => {
          currentIndex = Number(dot.dataset.index);
          renderSlide(currentIndex);
        });
      });

      requestFit();
    }

    function fitSlideToViewport() {
      if (window.innerWidth <= 720) {
        slideEl.style.setProperty("--slide-scale", "1");
        slideEl.style.width = "100%";
        slideEl.style.height = "auto";
        slideEl.style.minHeight = "80vh";
        slideFrameEl.classList.remove("scaled");
        return;
      }

      slideEl.style.setProperty("--slide-scale", "1");
      slideEl.style.width = "100%";
      slideEl.style.height = "100%";
      slideEl.style.minHeight = "100%";
      slideFrameEl.classList.remove("scaled");

      const frameWidth = slideViewportEl.clientWidth;
      const frameHeight = slideViewportEl.clientHeight;
      const contentWidth = slideEl.scrollWidth;
      const contentHeight = slideEl.scrollHeight;
      const scale = Math.min(1, frameWidth / contentWidth, frameHeight / contentHeight);

      slideEl.style.setProperty("--slide-scale", String(scale));
      slideEl.style.width = `${100 / scale}%`;
      slideEl.style.height = `${100 / scale}%`;
      slideEl.style.minHeight = `${100 / scale}%`;
      slideFrameEl.classList.toggle("scaled", scale < 0.999);
    }

    function requestFit() {
      window.clearTimeout(fitTimer);
      fitTimer = window.setTimeout(fitSlideToViewport, 20);
    }

    prevBtn.addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex -= 1;
        renderSlide(currentIndex);
      }
    });

    nextBtn.addEventListener("click", () => {
      if (currentIndex < slides.length - 1) {
        currentIndex += 1;
        renderSlide(currentIndex);
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowLeft") {
        prevBtn.click();
      }
      if (event.key === "ArrowRight") {
        nextBtn.click();
      }
    });

    let touchStartX = 0;
    let touchEndX = 0;

    slideEl.addEventListener("touchstart", (event) => {
      touchStartX = event.changedTouches[0].clientX;
    }, { passive: true });

    slideEl.addEventListener("touchend", (event) => {
      touchEndX = event.changedTouches[0].clientX;
      const delta = touchEndX - touchStartX;
      if (Math.abs(delta) < 60) return;
      if (delta < 0) nextBtn.click();
      if (delta > 0) prevBtn.click();
    }, { passive: true });

    window.addEventListener("resize", requestFit);
    window.addEventListener("load", requestFit);

    renderSlide(currentIndex);
  </script>
